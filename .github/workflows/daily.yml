name: daily-scan

on:
  schedule:
    # 毎日 7:30 JST に開始（GitHubの定期実行は数分〜十数分遅れることがあるため早めに設定）
    - cron: '30 22 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scan SUUMO and judge
        env:
          REINFOLIB_API_KEY: ${{ secrets.REINFOLIB_API_KEY }}
        run: node src/main.js
      - name: Commit results
        run: |
          git config user.name "mansion-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          git diff --cached --quiet || git commit -m "daily scan $(TZ=Asia/Tokyo date +%F)"
          git push
