<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>割安マンションレーダー</title>
<meta name="robots" content="noindex">
<style>
:root{
  --bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--sub:#6b6a66;--line:#e4e2dc;--accent:#0b6e4f;--accent-weak:#e3f1ec;
  --warn:#b45309;--warn-weak:#fdf0e1;--bad:#b42318;--bad-weak:#fbe9e7;--chip:#efeee9;--bar:#d9d7d0;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--sub:#a3a29c;--line:#33332f;--accent:#4cc39a;--accent-weak:#173a2e;
  --warn:#f0a54a;--warn-weak:#3a2a14;--bad:#f2867a;--bad-weak:#3d1c18;--chip:#2a2a27;--bar:#3a3a36;}}
:root[data-theme="dark"]{
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--sub:#a3a29c;--line:#33332f;--accent:#4cc39a;--accent-weak:#173a2e;
  --warn:#f0a54a;--warn-weak:#3a2a14;--bad:#f2867a;--bad-weak:#3d1c18;--chip:#2a2a27;--bar:#3a3a36;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:18px 0 8px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.meta{color:var(--sub);font-size:12.5px;margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11.5px;color:var(--sub)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:14px}
nav button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
details.filters{background:var(--card);border:1px solid var(--line);border-radius:12px;margin:6px 0 12px}
details.filters summary{padding:10px 14px;cursor:pointer;font-size:14px;color:var(--sub);list-style:none}
details.filters summary::after{content:" ▾"}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;padding:0 14px 14px}
.fgrid label{font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.fgrid select,.fgrid input[type=number],.fgrid input[type=search]{font-size:16px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.fgrid .chk{flex-direction:row;align-items:center;gap:6px;font-size:13.5px;color:var(--ink)}
.full{grid-column:1/-1}
.count{font-size:12.5px;color:var(--sub);margin:0 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:11.5px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--sub);white-space:nowrap}
.badge.star{background:var(--accent);color:var(--card);font-weight:600}
.badge.check{background:var(--accent-weak);color:var(--accent);font-weight:600}
.badge.new{background:var(--warn-weak);color:var(--warn)}
.badge.drop{background:var(--bad-weak);color:var(--bad)}
.name{font-weight:650;font-size:15.5px;word-break:break-all}
.score{text-align:right;flex:none}
.score b{font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.score span{font-size:11px;color:var(--sub)}
.score.neutral b{color:var(--sub)}
.price{display:flex;gap:14px;align-items:baseline;margin:8px 0 2px;flex-wrap:wrap}
.price .p{font-size:20px;font-weight:700}
.price .t{font-size:14px}
.price .t b{font-size:16px}
.spec{color:var(--sub);font-size:13px}
.cmp{margin:10px 0 4px;display:grid;gap:5px}
.row{display:grid;grid-template-columns:7.2em 1fr 4.2em;gap:8px;align-items:center;font-size:12.5px}
.row .lbl{color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.row .v.good{color:var(--accent)}
.row .v.bad{color:var(--bad)}
.track{position:relative;height:8px;background:var(--bar);border-radius:4px}
.track i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.35}
.track em{position:absolute;top:0;height:8px;border-radius:4px;background:var(--accent)}
.track em.over{background:var(--bad)}
.flags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.flag{font-size:11.5px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--sub)}
.flag.hard{background:var(--bad-weak);color:var(--bad)}
.links{display:flex;gap:14px;margin-top:10px;font-size:13.5px}
.fees{font-size:12.5px;color:var(--sub);margin-top:4px}
table.stats{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px}
table.stats th,table.stats td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.stats th:first-child,table.stats td:first-child{text-align:left}
table.stats th{font-size:12px;color:var(--sub);font-weight:500}
.note{font-size:12.5px;color:var(--sub);margin:14px 2px;line-height:1.7}
.more{display:block;width:100%;padding:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font-size:14px}
.empty{padding:30px 10px;text-align:center;color:var(--sub)}
@media (max-width:420px){.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>割安マンションレーダー</h1>
    <div class="meta" id="meta">読み込み中…</div>
    <div class="kpis" id="kpis"></div>
  </header>

  <nav role="tablist" id="tabs">
    <button data-tab="deals" aria-selected="true">割安</button>
    <button data-tab="drops">値下げ</button>
    <button data-tab="new">新着</button>
    <button data-tab="all">全物件</button>
    <button data-tab="stats">エリア相場</button>
  </nav>

  <details class="filters" id="filterBox">
    <summary id="filterSummary">絞り込み</summary>
    <div class="fgrid">
      <label class="full">エリア<select id="f-city"><option value="">すべて</option><option value="大阪市">大阪市（全区）</option></select></label>
      <label>予算上限（万円）<input type="number" id="f-maxPrice" inputmode="numeric" placeholder="例 5000"></label>
      <label>専有面積（㎡以上）<input type="number" id="f-minArea" inputmode="numeric" placeholder="例 55"></label>
      <label>間取り<select id="f-rooms"><option value="">すべて</option><option value="1">1部屋〜</option><option value="2">2部屋〜</option><option value="3">3部屋〜</option><option value="4">4部屋〜</option></select></label>
      <label>駅徒歩（分以内）<input type="number" id="f-maxWalk" inputmode="numeric" placeholder="例 10"></label>
      <label>築年数（年以内）<input type="number" id="f-maxAge" inputmode="numeric" placeholder="例 30"></label>
      <label>並び順<select id="f-sort"><option value="score">割安率が大きい順</option><option value="price">価格が安い順</option><option value="tsubo">坪単価が安い順</option><option value="new">掲載が新しい順</option><option value="drop">値下げ率が大きい順</option></select></label>
      <label class="full">キーワード<input type="search" id="f-q" placeholder="物件名・町名・駅名"></label>
      <label class="chk full"><input type="checkbox" id="f-hideHard" checked>訳あり候補（旧耐震・借地権・賃貸中・告知事項・投資用）を除く</label>
      <label class="chk full"><input type="checkbox" id="f-hideBus">バス便を除く</label>
    </div>
  </details>

  <div class="count" id="count"></div>
  <main id="list"></main>

  <p class="note">
    <b>判定の見方</b><br>
    坪単価を最大4つの物差しと比べています。<b>理論値</b>＝駅・町名・築年・面積・徒歩から推定した坪単価／<b>近似物件</b>＝同じ駅(または区)・築年±5年・面積±20%の掲載物件／<b>同じ建物</b>＝同じマンションの他住戸（過去2年の掲載含む）／<b>成約事例</b>＝国交省 不動産情報ライブラリの成約価格。<br>
    −15%以下の物差しが2つ以上かつ総合割安率（中央値）−25%以下で <b>★割安</b>、1つ以上かつ−15%以下で <b>要確認</b>。<br>
    安い理由（眺望・日当たり・リフォーム要否・管理状況など）はデータに出ないため、必ず物件ページと現地で確認してください。
  </p>
  <p class="note"><a href="data/mansion_radar.xlsx" download>Excelでダウンロード</a></p>
</div>

<script>
const $ = (s) => document.querySelector(s);
const state = { tab: 'deals', summary: null, all: null, shown: 40 };
const store = {
  get(k, d) { try { const v = localStorage.getItem('mr:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mr:' + k, JSON.stringify(v)); } catch {} },
};
const F = ['city', 'maxPrice', 'minArea', 'rooms', 'maxWalk', 'maxAge', 'sort', 'q', 'hideHard', 'hideBus'];

const yen = (man) => man >= 10000 ? `${Math.floor(man / 10000)}億${man % 10000 ? (man % 10000) + '万' : ''}円` : `${man.toLocaleString()}万円`;
const pct = (v) => v == null ? '–' : `${v > 0 ? '+' : ''}${(v * 100).toFixed(0)}%`;
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rooms = (l) => Number((l || '').match(/^(\d+)/)?.[1] || 0);

async function loadJSON(p) { const r = await fetch(p + '?v=' + Date.now()); if (!r.ok) throw new Error(p); return r.json(); }

async function init() {
  F.forEach((k) => {
    const el = $('#f-' + k), v = store.get('f-' + k, null);
    if (v != null) el.type === 'checkbox' ? (el.checked = v) : (el.value = v);
    el.addEventListener('input', () => { store.set('f-' + k, el.type === 'checkbox' ? el.checked : el.value); state.shown = 40; render(); });
  });
  document.querySelectorAll('#tabs button').forEach((b) => b.addEventListener('click', () => setTab(b.dataset.tab)));
  try { state.summary = await loadJSON('data/summary.json'); }
  catch { $('#meta').textContent = 'データがまだありません（初回実行後に表示されます）'; return; }
  const s = state.summary;
  const t = new Date(s.updatedAt);
  $('#meta').textContent = `${t.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })} 更新 ・ 掲載中 ${s.counts.active.toLocaleString()}件 ・ 理論値の当てはまり R²=${s.model.r2}`;
  $('#kpis').innerHTML = [['★割安', s.counts.star], ['要確認', s.counts.check], ['本日新着', s.counts.new], ['本日値下げ', s.counts.drop]]
    .map(([l, v]) => `<div class="kpi"><b>${v}</b><span>${l}</span></div>`).join('');
  const sel = $('#f-city');
  s.stats.map((x) => x.city).sort().forEach((c) => sel.insertAdjacentHTML('beforeend', `<option>${esc(c)}</option>`));
  sel.value = store.get('f-city', '') || '';
  setTab(store.get('tab', 'deals'));
}

async function setTab(tab) {
  state.tab = tab; state.shown = 40; store.set('tab', tab);
  document.querySelectorAll('#tabs button').forEach((b) => b.setAttribute('aria-selected', b.dataset.tab === tab));
  $('#filterBox').hidden = tab === 'stats';
  if ((tab === 'all' || tab === 'new' || tab === 'drops') && !state.all) {
    $('#list').innerHTML = '<div class="empty">読み込み中…</div>';
    state.all = await loadJSON('data/all.json');
  }
  render();
}

function filtered() {
  const v = (k) => $('#f-' + k).value, c = (k) => $('#f-' + k).checked;
  let rows = state.tab === 'deals' ? state.summary.deals.filter((x) => x.rating)
    : state.tab === 'drops' ? state.all.filter((x) => x.dropAmount)
    : state.tab === 'new' ? state.all.filter((x) => x.isNew)
    : state.all;
  const city = v('city'), maxP = +v('maxPrice'), minA = +v('minArea'), r = +v('rooms'), maxW = +v('maxWalk'), maxAge = +v('maxAge'), q = v('q').trim();
  rows = rows.filter((x) =>
    (!city || x.city === city || (city === '大阪市' && x.city.startsWith('大阪市'))) &&
    (!maxP || x.price <= maxP) && (!minA || x.area >= minA) && (!r || rooms(x.layout) >= r) &&
    (!maxW || (x.walk != null && x.walk <= maxW && !x.bus)) && (!maxAge || (x.age != null && x.age <= maxAge)) &&
    (!c('hideHard') || !x.hard) && (!c('hideBus') || !x.bus) &&
    (!q || [x.name, x.district, x.station, x.city].join(' ').includes(q)));
  const sorts = {
    score: (a, b) => (a.score ?? 9) - (b.score ?? 9),
    price: (a, b) => a.price - b.price,
    tsubo: (a, b) => a.tsuboPrice - b.tsuboPrice,
    new: (a, b) => b.firstSeen.localeCompare(a.firstSeen) || (a.score ?? 9) - (b.score ?? 9),
    drop: (a, b) => (a.dropPct ?? 0) - (b.dropPct ?? 0),
  };
  const key = state.tab === 'drops' && v('sort') === 'score' ? 'drop' : v('sort');
  return rows.sort(sorts[key] || sorts.score);
}

function bar(label, base, d, n) {
  if (base == null) return '';
  // 物差し=中央の線、本物件の位置を棒で表示（−50%〜+50%）
  const pos = Math.max(0, Math.min(100, 50 + d * 100));
  const left = Math.min(50, pos), width = Math.abs(pos - 50);
  return `<div class="row"><span class="lbl">${label}${n ? `<small>(${n})</small>` : ''}</span>
    <span class="track" title="基準 ${base}万円/坪"><em class="${d > 0 ? 'over' : ''}" style="left:${left}%;width:${width}%"></em><i style="left:50%"></i></span>
    <span class="v ${d <= -0.15 ? 'good' : d > 0.05 ? 'bad' : ''}">${pct(d)}</span></div>`;
}

function card(x) {
  const badges = [
    x.rating === '★割安' ? '<span class="badge star">★割安</span>' : x.rating ? '<span class="badge check">要確認</span>' : '',
    x.isNew ? '<span class="badge new">本日新着</span>' : '',
    x.dropAmount ? `<span class="badge drop">${x.dropDate.slice(5).replace('-', '/')} 値下げ −${x.dropAmount}万</span>` : '',
    `<span class="badge">${esc(x.city)}</span>`,
  ].join('');
  const fees = x.mgmtFee || x.repairFee ? `<div class="fees">管理費 ${(x.mgmtFee || 0).toLocaleString()}円・修繕 ${(x.repairFee || 0).toLocaleString()}円／月${x.floor ? `・${x.floor}階` : ''}${x.direction ? `・${esc(x.direction)}向き` : ''}${x.totalUnits ? `・総${x.totalUnits}戸` : ''}</div>` : '';
  const flags = [...(x.hard || []).map((f) => `<span class="flag hard">${esc(f)}</span>`), ...(x.flags || []).map((f) => `<span class="flag">${esc(f)}</span>`)].join('');
  const map = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('大阪府' + x.city + x.district + ' ' + x.name.replace(/[【〔\[(（].*?[】〕\])）]|[◆◇■□★☆♪～~].*$/g, ''))}`;
  return `<article class="card">
    <div class="top"><div><div class="badges">${badges}</div><div class="name">${esc(x.name)}</div></div>
      <div class="score ${x.score <= -0.1 ? '' : 'neutral'}"><b>${pct(x.score)}</b><span>総合割安率</span></div></div>
    <div class="price"><span class="p">${yen(x.price)}</span><span class="t">坪単価 <b>${x.tsuboPrice}</b>万円</span>${x.prevPrice ? `<s class="spec">${yen(x.prevPrice)}</s>` : ''}</div>
    <div class="spec">${x.area}㎡（${x.tsubo}坪）・${esc(x.layout)}・${x.builtYM ? x.builtYM.replace('-', '年') + '月築' : '築年不明'}（${x.age ?? '–'}年）<br>
      ${esc(x.station || x.lineName || '')} ${x.bus ? 'バス便' : '徒歩'}${x.walk ?? '–'}分${x.bus ? '相当' : ''}・${esc(x.district)}・掲載${x.daysListed}日目${x.dupCount > 1 ? `・${x.dupCount}社掲載` : ''}</div>
    ${fees}
    <div class="cmp">
      ${bar('理論値', x.modelPrice, x.devModel)}
      ${bar('近似物件', x.peerPrice, x.devPeer, x.peerN)}
      ${bar('同じ建物', x.buildingPrice, x.devBuilding, x.buildingN)}
      ${bar('成約事例', x.seiyakuPrice, x.devSeiyaku, x.seiyakuN)}
    </div>
    ${flags ? `<div class="flags">${flags}</div>` : ''}
    <div class="links"><a href="${esc(x.url)}" target="_blank" rel="noopener">SUUMOで見る</a><a href="${map}" target="_blank" rel="noopener">地図</a></div>
  </article>`;
}

function renderStats() {
  const s = state.summary.stats;
  $('#count').textContent = '坪単価の中央値（万円/坪・15㎡以上）';
  $('#list').innerHTML = `<table class="stats"><thead><tr><th>区市</th><th>掲載</th><th>掲載中央値</th><th>成約</th><th>成約中央値</th></tr></thead><tbody>${
    s.map((x) => `<tr><td>${esc(x.city)}</td><td>${x.n}</td><td>${x.listingMedian ?? '–'}</td><td>${x.seiyakuN || '–'}</td><td>${x.seiyakuMedian ?? '–'}</td></tr>`).join('')}</tbody></table>`;
}

function render() {
  if (!state.summary) return;
  if (state.tab === 'stats') return renderStats();
  if (state.tab !== 'deals' && !state.all) return;
  const rows = filtered();
  const active = F.filter((k) => !['sort', 'hideHard'].includes(k) && ($('#f-' + k).type === 'checkbox' ? $('#f-' + k).checked : $('#f-' + k).value)).length;
  $('#filterSummary').textContent = active ? `絞り込み（${active}件の条件）` : '絞り込み';
  $('#count').textContent = `${rows.length.toLocaleString()}件`;
  $('#list').innerHTML = rows.length
    ? rows.slice(0, state.shown).map(card).join('') + (rows.length > state.shown ? '<button class="more" id="more">さらに表示</button>' : '')
    : '<div class="empty">条件に合う物件はありません</div>';
  $('#more')?.addEventListener('click', () => { state.shown += 40; render(); });
}

init();
</script>
</body>
</html>
